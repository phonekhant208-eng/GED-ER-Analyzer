<main class="container">
    <!-- TOP WORKSPACE: 50/50 Split for Passages & Editor -->
    <section class="workspace">
        
        <!-- LEFT COLUMN: Source Panel -->
        <div class="panel source-panel">
            <div class="panel-header">
                <label for="passage-select" class="section-label">Select Practice Prompt:</label>
                <select id="passage-select" class="dropdown">
                    <option value="custom" selected>Custom (Paste your own passages)</option>
                </select>
            </div>
            
            <div id="preloaded-view" class="passage-content scrollable hidden"></div>

            <div id="custom-view" class="passage-content">
                <div class="notice-badge">💡 Optional: Leave blank for grammar & structure evaluation only.</div>
                
                <div class="input-group">
                    <label class="custom-label">Passage A Text</label>
                    <textarea class="custom-textarea" placeholder="Paste the first source text here..."></textarea>
                </div>
                
                <div class="input-group">
                    <label class="custom-label">Passage B Text</label>
                    <textarea class="custom-textarea" placeholder="Paste the opposing source text here..."></textarea>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Essay Editor -->
        <div class="panel action-panel">
            <div id="editor-view" class="editor-container">
                <textarea id="essay-input" class="main-textarea" placeholder="Type or paste your extended response here..."></textarea>
                <button class="btn-primary" id="analyze-btn">Grade My Extended Response</button>
            </div>
        </div>

    </section>

    <!-- BOTTOM FULL-WIDTH RESULTS PANEL -->
    <section id="results-view" class="panel results-panel hidden">
        <!-- AI generated report populates here dynamically with proper padding -->
    </section>
</main>
