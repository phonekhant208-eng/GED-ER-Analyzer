<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitByBit RLA Analyzer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="RLAmainpage.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <div class="logo">BitByBit <span>RLA</span></div>
            <div class="header-tag">Analyzer</div>
        </div>
    </nav>

    <main class="container">
        <!-- TOP WORKSPACE: 50/50 Split -->
        <section class="workspace">
            
            <!-- LEFT COLUMN: Source Passages -->
            <div class="panel source-panel">
                <div class="panel-header">
                    <label for="passage-select" class="section-label">Select Practice Prompt:</label>
                    <select id="passage-select" class="dropdown">
                        <option value="custom" selected>Custom (Paste your own passages)</option>
                    </select>
                </div>
                
                <div id="preloaded-view" class="passage-content scrollable hidden"></div>

                <div id="custom-view" class="passage-content">
                    <div class="notice-badge">💡 Optional: Leave blank for grammar & structure evaluation only.</div>
                    
                    <div class="input-group">
                        <label class="custom-label">Passage A Text</label>
                        <textarea class="custom-textarea" placeholder="Paste the first source text here..."></textarea>
                    </div>
                    
                    <div class="input-group">
                        <label class="custom-label">Passage B Text</label>
                        <textarea class="custom-textarea" placeholder="Paste the opposing source text here..."></textarea>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Essay Editor -->
            <div class="panel action-panel">
                <!-- GED Style Toolbar -->
                <div class="editor-toolbar">
                    <div class="toolbar-actions">
                        <button class="tool-btn" data-cmd="cut">✂ Cut</button>
                        <button class="tool-btn" data-cmd="copy">📋 Copy</button>
                        <button class="tool-btn" data-cmd="paste">📋 Paste</button>
                        <button class="tool-btn" data-cmd="undo">↩ Undo</button>
                        <button class="tool-btn" data-cmd="redo">↪ Redo</button>
                    </div>
                    <div id="test-timer" class="timer hidden">45:00</div>
                </div>

                <div id="editor-view" class="editor-container">
                    <textarea id="essay-input" class="main-textarea" placeholder="Type or paste your extended response here..."></textarea>
                    <button class="btn-primary" id="analyze-btn">Start Test</button>
                </div>
            </div>

        </section>

        <!-- BOTTOM FULL-WIDTH RESULTS -->
        <section id="results-view" class="panel results-panel hidden">
            <!-- Results populate here -->
        </section>
    </main>

    <!-- Reusable Custom Pop-up Modal -->
    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="modal-title">Title</h3>
            <p id="modal-text">Message goes here.</p>
            <div id="modal-buttons" class="modal-actions"></div>
        </div>
    </div>

    <script src="RLAmainpage.js"></script>
</body>
</html>
